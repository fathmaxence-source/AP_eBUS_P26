<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080">
  <defs>
    <style>
      .titre { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .section { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .texte { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .normal { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .petit { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .cadre { fill: #ffffff; stroke: #6b7f95; stroke-width: 2; rx: 18; ry: 18; }
      .module { fill: #eef5ff; stroke: #7b95b8; stroke-width: 2; rx: 18; ry: 18; }
      .module2 { fill: #dfeeff; stroke: #2f80ed; stroke-width: 2; rx: 18; ry: 18; }
      .zone { fill: #f8fbff; stroke: #2f80ed; stroke-width: 2.5; stroke-dasharray: 9 7; rx: 24; ry: 24; }
      .note { fill: #fff8e8; stroke: #e1b12c; stroke-width: 2; rx: 18; ry: 18; }
      .fleche { stroke: #1f2d3d; stroke-width: 3.5; fill: none; marker-end: url(#pointe); }
      .flecheb { stroke: #2f80ed; stroke-width: 3; fill: none; marker-end: url(#pointeBleue); }
      .pointille { stroke-dasharray: 9 8; }
    </style>
    <marker id="pointe" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1f2d3d"/>
    </marker>
    <marker id="pointeBleue" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2f80ed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1080" fill="#ffffff"/>
  <text x="850" y="52" text-anchor="middle" class="titre">Architecture fonctionnelle de l'outil d'aide à la décision</text>
  <text x="850" y="85" text-anchor="middle" class="normal">Dossier Outil - workflow modulaire, flux de données et chaîne de calcul</text>

  <rect x="330" y="120" width="1300" height="900" class="zone"/>
  <text x="360" y="155" class="section">Système applicatif "Outil"</text>

  <rect x="45" y="190" width="220" height="95" class="module"/>
  <text x="155" y="228" text-anchor="middle" class="texte">Utilisateur</text>
  <text x="155" y="252" text-anchor="middle" class="normal">décideur / analyste</text>

  <rect x="45" y="335" width="220" height="95" class="module"/>
  <text x="155" y="373" text-anchor="middle" class="texte">BusGrid.bat</text>
  <text x="155" y="397" text-anchor="middle" class="normal">lanceur et bootstrap</text>

  <rect x="45" y="480" width="220" height="120" class="module"/>
  <text x="155" y="520" text-anchor="middle" class="texte">WPy64-31180</text>
  <text x="155" y="546" text-anchor="middle" class="normal">environnement Python</text>
  <text x="155" y="570" text-anchor="middle" class="petit">runtime et dépendances</text>

  <rect x="390" y="185" width="360" height="110" class="module2"/>
  <text x="570" y="224" text-anchor="middle" class="texte">AP02_interface.py</text>
  <text x="570" y="250" text-anchor="middle" class="normal">orchestrateur général</text>
  <text x="570" y="274" text-anchor="middle" class="petit">navigation, état partagé, déclenchement des calculs et export</text>

  <rect x="390" y="335" width="320" height="290" class="cadre"/>
  <text x="420" y="370" class="section">1. Interface utilisateur</text>

  <rect x="420" y="395" width="260" height="62" class="module"/>
  <text x="550" y="430" text-anchor="middle" class="texte">home1.py</text>
  <text x="550" y="451" text-anchor="middle" class="petit">accueil et présentation du périmètre</text>

  <rect x="420" y="478" width="260" height="78" class="module"/>
  <text x="550" y="513" text-anchor="middle" class="texte">page1.py</text>
  <text x="550" y="536" text-anchor="middle" class="petit">saisie des paramètres, validation</text>
  <text x="550" y="555" text-anchor="middle" class="petit">et personnalisation des hypothèses</text>

  <rect x="420" y="577" width="260" height="62" class="module"/>
  <text x="550" y="612" text-anchor="middle" class="texte">page2.py</text>
  <text x="550" y="633" text-anchor="middle" class="petit">consultation et filtrage des résultats</text>

  <rect x="760" y="335" width="360" height="420" class="cadre"/>
  <text x="790" y="370" class="section">2. Données de travail</text>

  <rect x="790" y="395" width="300" height="118" class="module"/>
  <text x="940" y="428" text-anchor="middle" class="texte">Entrées normalisées</text>
  <text x="940" y="454" text-anchor="middle" class="petit">DF_valeurs_entree</text>
  <text x="940" y="476" text-anchor="middle" class="petit">DF_valeurs_defaut</text>
  <text x="940" y="498" text-anchor="middle" class="petit">dic_valeurs_lignes</text>

  <rect x="790" y="560" width="300" height="78" class="module2"/>
  <text x="940" y="594" text-anchor="middle" class="texte">DF_resultats</text>
  <text x="940" y="617" text-anchor="middle" class="petit">matrice des 18 scénarios comparés</text>

  <rect x="790" y="675" width="300" height="60" class="module"/>
  <text x="940" y="708" text-anchor="middle" class="texte">DF_graph / Part / test_data</text>
  <text x="940" y="728" text-anchor="middle" class="petit">objets de restitution graphique</text>

  <rect x="1170" y="335" width="390" height="190" class="cadre"/>
  <text x="1200" y="370" class="section">3. Référentiels internes</text>

  <rect x="1200" y="395" width="330" height="58" class="module"/>
  <text x="1365" y="428" text-anchor="middle" class="texte">Coeff_PV régional</text>
  <text x="1365" y="447" text-anchor="middle" class="petit">coefficients saisonniers de production photovoltaïque</text>

  <rect x="1200" y="468" width="330" height="58" class="module"/>
  <text x="1365" y="501" text-anchor="middle" class="texte">Images et logos</text>
  <text x="1365" y="520" text-anchor="middle" class="petit">ressources visuelles pour le rapport</text>

  <rect x="390" y="675" width="730" height="220" class="cadre"/>
  <text x="420" y="710" class="section">4. Noyau scientifique</text>

  <rect x="430" y="745" width="280" height="110" class="module2"/>
  <text x="570" y="782" text-anchor="middle" class="texte">calcul.py</text>
  <text x="570" y="807" text-anchor="middle" class="normal">modèle techno-énergétique</text>
  <text x="570" y="830" text-anchor="middle" class="petit">autonomie, recharge, PV, CAPEX, OPEX, recettes</text>

  <rect x="790" y="745" width="280" height="110" class="module2"/>
  <text x="930" y="782" text-anchor="middle" class="texte">Graphiques.py</text>
  <text x="930" y="807" text-anchor="middle" class="normal">modèle de projection économique</text>
  <text x="930" y="830" text-anchor="middle" class="petit">coût cumulé et répartition des postes sur le cycle de vie</text>

  <rect x="1170" y="565" width="390" height="330" class="cadre"/>
  <text x="1200" y="600" class="section">5. Sorties et restitution</text>

  <rect x="1200" y="635" width="330" height="62" class="module"/>
  <text x="1365" y="670" text-anchor="middle" class="texte">Graphiques interactifs</text>
  <text x="1365" y="691" text-anchor="middle" class="petit">courbes, histogrammes et diagrammes</text>

  <rect x="1200" y="720" width="330" height="62" class="module"/>
  <text x="1365" y="755" text-anchor="middle" class="texte">generate_pdf.py</text>
  <text x="1365" y="776" text-anchor="middle" class="petit">génération du rapport exportable</text>

  <rect x="1200" y="805" width="330" height="62" class="module2"/>
  <text x="1365" y="840" text-anchor="middle" class="texte">Rapport PDF</text>
  <text x="1365" y="861" text-anchor="middle" class="petit">synthèse d'aide à la décision</text>

  <rect x="1170" y="185" width="390" height="105" class="note"/>
  <text x="1365" y="220" text-anchor="middle" class="texte">Extension prévue</text>
  <text x="1365" y="246" text-anchor="middle" class="normal">energy_data / page 3</text>
  <text x="1365" y="268" text-anchor="middle" class="petit">fonctionnalité anticipée mais non raccordée à ce jour</text>

  <line x1="265" y1="238" x2="390" y2="238" class="fleche"/>
  <line x1="155" y1="285" x2="155" y2="335" class="fleche"/>
  <line x1="155" y1="430" x2="155" y2="480" class="fleche"/>
  <path d="M265 540 C330 540, 330 240, 390 240" class="fleche"/>

  <line x1="570" y1="295" x2="570" y2="335" class="flecheb"/>
  <path d="M710 495 L760 495" class="fleche"/>
  <path d="M1090 454 L1170 454 L1170 800 L1200 800" class="fleche"/>

  <path d="M940 513 L940 560" class="fleche"/>
  <path d="M940 638 L940 675" class="fleche"/>
  <path d="M940 454 L940 745 L430 745" class="fleche"/>
  <path d="M1530 424 L1575 424 L1575 800 L1200 800" class="fleche"/>
  <path d="M1365 453 L1365 540 L570 540 L570 745" class="fleche"/>

  <path d="M710 608 L735 608 L735 666 L430 666 L430 790" class="flecheb"/>
  <path d="M710 608 L735 608 L735 790 L790 790" class="flecheb"/>

  <line x1="710" y1="790" x2="790" y2="790" class="fleche"/>
  <path d="M1070 790 L1110 790 L1110 705 L940 705" class="fleche"/>

  <path d="M1090 705 L1140 705 L1140 666 L1200 666" class="fleche"/>
  <path d="M1070 790 L1140 790 L1140 666 L1200 666" class="fleche"/>
  <path d="M570 295 L570 720 L1200 720" class="flecheb"/>
  <line x1="1530" y1="751" x2="1530" y2="805" class="fleche"/>

  <path d="M1365 290 L1365 720" class="fleche pointille"/>

  <text x="630" y="322" text-anchor="middle" class="petit">pilotage des pages</text>
  <text x="735" y="485" text-anchor="middle" class="petit">validation et normalisation</text>
  <text x="943" y="545" text-anchor="middle" class="petit">construction des scénarios</text>
  <text x="683" y="904" class="normal">Scénarios évalués : Recharge {CL, CLR} × Scénario PV {ZPV, INJ, ACI} × Type PV {1, 2, 3} = 18 cas</text>
  <text x="683" y="934" class="normal">Chaîne de traitement : saisie → normalisation → calcul → projection économique → visualisation / rapport</text>
  <text x="683" y="964" class="normal">Le dossier WPy64-31180 constitue le conteneur d'exécution et non un module métier autonome.</text>
</svg>
